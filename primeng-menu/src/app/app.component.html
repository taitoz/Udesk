<div class="card">
    <div class="app-details">
        <!--        <img src="logo48_.png" alt="" width="48" height="48">-->
        <p-avatar image="" size="xlarge" label="U"></p-avatar>
        <span class="app-name">desk</span>
    </div>

    <p-panelMenu #menubar [model]="menuItems">
        <ng-template pTemplate="item" let-item>
            <a pRipple class="flex align-items-center px-3 py-2 cursor-pointer">
                <i [class]="item.icon + ' text-primary'"></i>
                <span class="ml-2">
                    {{ item.label }}
                </span>
                <p-badge *ngIf="item.badge" class="ml-auto" [value]="item.badge"/>
                <span *ngIf="item.badge" class="ml-auto border-1 surface-border border-round surface-100 text-xs p-1">
                    {{ item.badge }}
                </span>
            </a>
        </ng-template>
    </p-panelMenu>
    <p-button label="Toggle All" [text]="true" (onClick)="toggleAll()"/>
</div>
