    <h2 class="m-3">Настройки</h2>
    <p-tabView [(activeIndex)]="activeTabIndex">

        <p-tabPanel>
            <ng-template pTemplate="header">
                <span>Профили</span>
            </ng-template>
            <div class="tableContainer">
                <p-table *ngIf="showTable" [value]="profiles"
                         styleClass="p-datatable-striped"
                         [scrollable]="true"
                         scrollHeight="flex">
                    <ng-template pTemplate="header">
                        <tr>
                            <th>Name</th>
                            <th>Image</th>
                            <th>homeUrl</th>
                            <th>lang</th>
                            <th></th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-profile>
                        <tr>
                            <td class="">
                                <div class="flex flex-column gap-2">
                                    <span *ngIf="!editingProfile" class="font-bold ml-2 truncate-text">
                                        {{ profile.name }}
                                    </span>
                                    <input *ngIf="editingProfile"
                                           pInputText type="text"
                                           [(ngModel)]="profile.name"
                                           [ngStyle]="{'width': '100%'}"
                                           (keydown.space)="$event.stopPropagation()"
                                           (keydown.enter)="saveProfileKeyEdit()"
                                           (keydown.escape)="cancelProfileKeyEdit()">
                                    <div class="flex flex-row">
                                        <div class="p-toolbar-group-start">
                                            <button pButton type="button"
                                                    pTooltip="load" tooltipPosition="top"
                                                    icon="bx bx-check"
                                                    (click)="setActiveProfile(profile._id)"
                                                    class="p-button-text p-button-success" [outlined]="true">
                                            </button>
                                            <button pButton type="button"
                                                    pTooltip="delete" tooltipPosition="top"
                                                    icon="bx bxs-trash"
                                                    (click)="deleteProfile(profile._id)"
                                                    class="p-button-text p-button-danger" [outlined]="true">
                                            </button>
                                            <button pButton type="button"
                                                    pTooltip="export" tooltipPosition="top"
                                                    icon="bx bxs-file-export"
                                                    (click)="exportProfile(profile._id)"
                                                    class="p-button-text p-button-info" [outlined]="true">
                                            </button>
                                        </div>
                                    </div>
                                    <p-tag *ngIf="activeProfile._id === profile._id"
                                           [value]="'active'"
                                           [severity]="'success'"/>
                                </div>
                            </td>
                            <td class="">
                                <img [alt]="profile.logo" ngSrc="{{getLogoPath(profile)}}" height="32"
                                     width="32"
                                     style="vertical-align: middle" pTooltip="profile logo"
                                />
                                <div class="flex align-items-center justify-content-center gap-2">
                                    <button *ngIf="editingProfile && editingProfile._id === profile._id"
                                            pButton type="button"
                                            icon="bx bx-pencil"
                                            class="p-button-rounded p-button-text"
                                            (click)="setProfileLogo()">
                                    </button>
                                </div>
                            </td>
                            <td class="">
                                <span *ngIf="!editingProfile" class="truncate-text">
                                    {{ profile.homeUrl }}
                                </span>
                                <input *ngIf="editingProfile"
                                       pInputText type="text"
                                       [(ngModel)]="profile.homeUrl"
                                       [ngStyle]="{'width': '100%'}"
                                       (keydown.space)="$event.stopPropagation()"
                                       (keydown.enter)="saveProfileKeyEdit()"
                                       (keydown.escape)="cancelProfileKeyEdit()">
                            </td>
                            <td class="">
                                <p-dropdown placeholder="Select"
                                            [options]="['ru', 'en']"
                                            [(ngModel)]="profile.lang"/>
                            </td>
                            <td style="width:10%">
                                <div class="flex align-items-center justify-content-center gap-2">
                                    <button *ngIf="!editingProfile || editingProfile._id !== profile._id"
                                            pButton
                                            type="button"
                                            icon="bx bx-pencil"
                                            class="p-button-rounded p-button-text"
                                            (click)="startProfileKeyEdit(profile)">
                                    </button>
                                    <button *ngIf="editingProfile && editingProfile._id === profile._id"
                                            pButton
                                            type="button"
                                            icon="bx bx-check"
                                            class="p-button-rounded p-button-text p-button-success mr-2"
                                            (click)="saveProfileKeyEdit()">
                                    </button>
                                    <button *ngIf="editingProfile && editingProfile._id === profile._id"
                                            pButton
                                            type="button"
                                            icon="bx bx-x"
                                            class="p-button-rounded p-button-text p-button-danger"
                                            (click)="cancelProfileKeyEdit()">
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="summary">
                        <div class="p-toolbar-group-start">
                            <div style="text-align:left">
                                <button pButton type="button" icon="bx bx-down-arrow-alt" class="p-button-text"
                                        pTooltip="Add" label="Add"
                                        tooltipPosition="top"
                                        (click)="addProfile()"></button>
                            </div>
                            <div style="text-align:left">
                                <button pButton type="button" icon="bx bxs-file-import" class="p-button-text"
                                        pTooltip="Import" label="Import"
                                        tooltipPosition="top"
                                        (click)="importProfile()"></button>
                            </div>
                        </div>
                    </ng-template>
                </p-table>
            </div>
        </p-tabPanel>

        <p-tabPanel>
            <ng-template pTemplate="header">
                <span>Сервисы</span>
            </ng-template>
            <div class="tableContainer">
                <p-treeTable #tt *ngIf="showTable" [value]="sideMenuTreeNodes"
                             [columns]="cols"
                             [scrollable]="true"
                             scrollHeight="flex"
                             styleClass="p-treetable-gridlines p-treetable-sm"
                             selectionMode="single" sortField="id"
                             [(selection)]="selectedNode" dataKey="id" (onNodeSelect)="onSelect($event)">
                    <ng-template pTemplate="caption">
                        <p-toolbar styleClass="mb-2 gap-1">
                            <ng-template pTemplate="left">
                                <div class="p-input-icon-left">
                                    <i class="pi pi-search"></i>
                                    <input type="text" pInputText placeholder="Поиск"
                                           (input)="tt.filterGlobal($event.target['value'], 'contains')"/>
                                </div>
                            </ng-template>
                        </p-toolbar>
                    </ng-template>
                    <ng-template pTemplate="header" let-columns>
                        <tr>
                            <th *ngFor="let col of columns" [ttSortableColumn]="col.field">
                                <div class="flex flex-row gap-2 align-items-center flex-wrap">
                                    <p>{{ col.header }}</p>
                                    <p-treeTableSortIcon [field]="col.field"/>
                                </div>
                            </th>
                            <th style="width:10%"></th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-rowNode let-rowData="rowData" let-columns="columns">
                        <tr [ttSelectableRow]="rowNode">
                            <td *ngFor="let col of columns; let i = index"
                                [ngClass]="{'p-toggler-column': i === 0}">
                                <p-treeTableToggler [rowNode]="rowNode" *ngIf="i === 0"></p-treeTableToggler>
                                <span *ngIf="!editingTreeNode || editingTreeNode.id !== rowData.id"
                                      class="truncate-text">
                                {{ rowData[col.field] }}
                            </span>
                                <input *ngIf="editingTreeNode && editingTreeNode.id === rowData.id"
                                       pInputText type="text"
                                       [(ngModel)]="rowData[col.field]"
                                       [ngStyle]="{'width': i === 0 ? '70%': '100%'}"
                                       (keydown.space)="$event.stopPropagation()"
                                       (keydown.enter)="saveTreeNodeEdit()"
                                       (keydown.escape)="cancelTreeNodeEdit()">
                            </td>
                            <td style="width:10%">
                                <div class="flex align-items-center justify-content-center gap-2">
                                    <button *ngIf="!editingTreeNode || editingTreeNode.id !== rowData.id"
                                            pButton
                                            type="button"
                                            icon="bx bx-pencil"
                                            class="p-button-rounded p-button-text"
                                            (click)="startTreeNodeEdit(rowData)">
                                    </button>
                                    <button *ngIf="editingTreeNode && editingTreeNode.id === rowData.id"
                                            pButton
                                            type="button"
                                            icon="bx bx-check"
                                            class="p-button-rounded p-button-text p-button-success mr-2"
                                            (click)="saveTreeNodeEdit()">
                                    </button>
                                    <button *ngIf="editingTreeNode && editingTreeNode.id === rowData.id"
                                            pButton
                                            type="button"
                                            icon="bx bx-x"
                                            class="p-button-rounded p-button-text p-button-danger"
                                            (click)="cancelTreeNodeEdit()">
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="summary">
                        <div style="text-align:left">
                            <button pButton type="button" icon="bx bx-down-arrow-alt" class="p-button-text"
                                    pTooltip="Add" label="Add"
                                    tooltipPosition="top"
                                    [disabled]="!selectedNode"
                                    (click)="addItem(selectedNode.data, false)">
                            </button>
                            <button pButton type="button" icon="bx bx-subdirectory-right" class="p-button-text"
                                    pTooltip="Add child" label="Add child"
                                    tooltipPosition="top"
                                    [disabled]="!selectedNode"
                                    (click)="addItem(selectedNode.data, true)">
                            </button>
                            <button pButton type="button" icon="bx bx-trash-alt" class="p-button-text p-button-danger"
                                    pTooltip="Удалить" label="Delete"
                                    tooltipPosition="top"
                                    [disabled]="!selectedNode"
                                    (click)="deleteItem(selectedNode)">
                            </button>
                        </div>
                    </ng-template>
                </p-treeTable>
            </div>
        </p-tabPanel>

        <p-tabPanel>
            <ng-template pTemplate="header">
                <span>Page Actions</span>
            </ng-template>
            <div class="tableContainer">
                <p-table *ngIf="showTable" [value]="pageActions"
                         styleClass="p-datatable-striped"
                         [scrollable]="true"
                         scrollHeight="flex">
                    <ng-template pTemplate="header">
                        <tr>
                            <th>Domain</th>
                            <th>Actions</th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-pageAction>
                        <tr>
                            <td class="">
                                <span *ngIf="!editingProfile" class="font-bold ml-2 truncate-text">
                                    {{ pageAction.domain }}
                                </span>
                                <input *ngIf="editingProfile"
                                       pInputText type="text"
                                       [(ngModel)]="pageAction.domain"
                                       [ngStyle]="{'width': '100%'}"
                                       (keydown.space)="$event.stopPropagation()"
                                       (keydown.enter)="saveProfileKeyEdit()"
                                       (keydown.escape)="cancelProfileKeyEdit()">

                            </td>
                            <td style="width:10%">
                                <div class="flex align-items-center justify-content-center gap-2">
                                    <button pButton
                                            type="button"
                                            icon="bx bx-pencil"
                                            class="p-button-rounded p-button-text"
                                            (click)="showPageActionsDialog(pageAction.actions)">
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="summary">
                        <div class="p-toolbar-group-start">
                            <div style="text-align:left">
                                <button pButton type="button" icon="bx bx-down-arrow-alt" class="p-button-text"
                                        pTooltip="Add" label="Add"
                                        tooltipPosition="top"
                                        (click)="addProfile()"></button>
                            </div>
                            <div style="text-align:left">
                                <button pButton type="button" icon="bx bxs-file-import" class="p-button-text"
                                        pTooltip="Import" label="Import"
                                        tooltipPosition="top"
                                        (click)="importProfile()"></button>
                            </div>
                        </div>
                    </ng-template>
                </p-table>
            </div>
        </p-tabPanel>

        <p-tabPanel>
            <ng-template pTemplate="header">
                <span>Основные</span>
            </ng-template>
            <h2>Параметры</h2>

            <hr class="mb-3 mx-2 border-top-1 border-none border-gray-600">
            <h3>Тема</h3>

            <p-selectButton
                    [options]="themeOptions"
                    [(ngModel)]="theme"
                    (onChange)="toggleTheme($event)"
                    optionLabel="label"
                    optionValue="value"/>

            <hr class="mb-3 mx-2 border-top-1 border-none border-gray-600">

        </p-tabPanel>

    </p-tabView>
</div>
<p-toast position="top-right"
         [life]="4000"
         [showTransformOptions]="'translateY(100%)'"
         [showTransformOptions]="'translateX(100%)'"
         [showTransitionOptions]="'300ms'"
         [hideTransitionOptions]="'300ms'">
</p-toast>
<p-confirmDialog [style]="{width: '50vw'}" [baseZIndex]="10000"></p-confirmDialog>
