    <h2 class="m-3">Настройки</h2>
    <p-tabView [(activeIndex)]="activeIndex">

        <p-tabPanel>
            <ng-template pTemplate="header">
                <span>Профиль</span>
            </ng-template>

            <p-table *ngIf="showTable" [value]="profilesFlat"
                     styleClass="p-datatable-striped"
                     rowGroupMode="rowspan"
                     groupRowsBy="name"
                     [scrollable]="true"
                     scrollHeight="700px"
                     [tableStyle]="{'width': '800px'}">
                <ng-template pTemplate="colgroup" let-columns>
                    <colgroup>
                        <col *ngFor="let col of columns"
                             [ngStyle]="{'width': (col && col.width ? col.width + 'px' : 'auto')}">
                    </colgroup>
                </ng-template>
                <ng-template pTemplate="header">

                </ng-template>
                <ng-template pTemplate="body"
                             let-profile
                             let-rowgroup="rowgroup"
                             let-rowspan="rowspan">
                    <tr>
                        <td *ngIf="rowgroup" [attr.rowspan]="rowspan">
                            <div class="flex align-items-center justify-content-left gap-2">

                                <span class="font-bold ml-2">{{ profile.name }}</span>
                                <!--                            <button pButton type="button" icon="bx bx-archive-in" label="Load" [outlined]="true"-->
                                <!--                                    pTooltip="Load" tooltipPosition="top" [style]="{'margin':'20px'}"-->
                                <!--                                    (click)="setActiveProfile(profile2.id)"></button>-->
                                <!--                            <button pButton type="button" icon="bx bx-trash" class="p-button-danger" [outlined]="true"-->
                                <!--                                    label="Delete"-->
                                <!--                                    pTooltip="Delete" tooltipPosition="top" [style]="{'margin':'20px'}"-->
                                <!--                                    (click)="deleteProfile(profile2.id)"></button>-->
                                <button pButton
                                        type="button"
                                        icon="bx bx-check"
                                        (click)="setActiveProfile(profile.id)"
                                        class="p-button-rounded p-button-text p-button-success mr-2"
                                        [outlined]="true"
                                >
                                </button>
                                <button pButton
                                        type="button"
                                        icon="bx bx-trash"
                                        (click)="deleteProfile(profile.id)"
                                        class="p-button-rounded p-button-text p-button-danger"
                                        [outlined]="true"
                                >
                                </button>
                            </div>
                        </td>

                        <td class="profileKey">
                            {{ profile.key }}
                        </td>
                        <td *ngIf="(profile.key === 'lang')">
                            <p-dropdown
                                    [options]="['ru', 'en']"
                                    [(ngModel)]="profile.value"
                                    placeholder="Select"/>
                        </td>
                        <td *ngIf="(profile.key === 'logo')">
                            <img [alt]="profile.logo" ngSrc="{{getProfileLogo(profile)}}" height="32" width="32"
                                 style="vertical-align: middle" (click)="setProfileLogo(profile)"/>
                        </td>
                        <td *ngIf="(!['logo', 'lang'].includes(profile.key))" [pEditableColumn]="profile.value"
                            pEditableColumnField="value">
                            <p-cellEditor>
                                <ng-template pTemplate="input">
                                    <p-inputGroup>
                                        <input pInputText
                                               type="text"
                                               (focusout)="setProfileKey(profile.id, profile.key, profile.value)"
                                               [(ngModel)]="profile.value"/>
                                        <button type="button" pButton
                                                icon="bx bx-check"
                                                class="p-button-success bx-xs"
                                                [outlined]="true"
                                                (click)="setProfileKey(profile.id, profile.key, profile.value)"
                                        ></button>
                                    </p-inputGroup>
                                </ng-template>
                                <ng-template pTemplate="output">
                                    {{ profile.value }}
                                </ng-template>
                            </p-cellEditor>
                        </td>
                        <!--                        <td>-->
                        <!--                            <p-tag [value]="profile.status" [severity]="getSeverity(customer.status)" />-->
                        <!--                        </td>-->

                    </tr>
                </ng-template>
                <ng-template pTemplate="summary">
                    <div style="text-align:left">
                        <button pButton type="button" icon="bx bx-plus" label="Add" [outlined]="true"
                                pTooltip="Add" tooltipPosition="top" [style]="{'margin':'20px'}"
                                (click)="addProfile()"></button>
                    </div>
                </ng-template>
            </p-table>
        </p-tabPanel>

        <p-tabPanel>
            <ng-template pTemplate="header">
                <span>Сервисы</span>
            </ng-template>
            <p-treeTable #tt *ngIf="showTable" [value]="servicesMenuData"
                         [columns]="cols"
                         [scrollable]="true"
                         styleClass="p-treetable-gridlines p-treetable-sm"
                         scrollHeight="500px"
                         [tableStyle]="{'margin-bottom':'20px'}"
                         selectionMode="single" sortField="id"
                         [(selection)]="selectedNodes" dataKey="key" (onNodeSelect)="onSelect($event)">
                <ng-template pTemplate="colgroup" let-columns>
                    <colgroup>
                        <col *ngFor="let col of columns"
                             [ngStyle]="{'width': (col && col.width ? col.width + 'px' : 'auto')}">
                    </colgroup>
                </ng-template>
                <ng-template pTemplate="caption">

                    <p-toolbar styleClass="mb-4 gap-2">
                        <ng-template pTemplate="left">
                            <div class="p-input-icon-left">
                                <i class="pi pi-search"></i>
                                <input
                                        type="text"
                                        pInputText
                                        placeholder="Global Search"
                                        (input)="tt.filterGlobal($event.target.value, 'contains')"/>
                            </div>
                        </ng-template>

                        <ng-template pTemplate="right">
                            <p-button
                                    label="Import"
                                    class="mr-2 inline-block" [outlined]="true"
                                    (click)="importServicesTableData()"/>
                            <p-button
                                    severity="help"
                                    label="Export"
                                    icon="pi pi-upload" [outlined]="true"
                                    (click)="exportServicesTableData()"/>
                        </ng-template>
                    </p-toolbar>

                </ng-template>
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th *ngFor="let col of columns" [ttSortableColumn]="col.field">
                            <p *ngIf="col.header !='id'">{{ col.header }}</p>
                            <p-treeTableSortIcon [field]="col.field"/>
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowNode let-rowData="rowData" let-columns="columns">
                    <tr [ttSelectableRow]="rowNode">
                        <td *ngFor="let col of columns; let i = index" ttEditableColumn
                            [ngClass]="{'p-toggler-column': i === 0}">
                            <p-treeTableToggler [rowNode]="rowNode" *ngIf="i === 0"></p-treeTableToggler>
                            <!--              <p-treeTableCheckbox [value]="rowNode" *ngIf="i == 3"></p-treeTableCheckbox>-->
                            <p-treeTableCellEditor>
                                <ng-template pTemplate="input">
                                    <div class="p-inputgroup">
                                        <input pInputText type="text" [(ngModel)]="rowData[col.field]"
                                               [ngStyle]="{'width': i == 0 ? '90%': '100%',
                            'margin-top': i == 0 ? '-30px': '0', 'margin-left': i == 0 ? '40px': '0' }"
                                               *ngIf="col.editable">
                                        <!--<button type="button" pButton pRipple icon="bx bx-check" class="flex justify-content-center"-->
                                        <!--     click)="nodeSave()" *ngIf="edit"></button>-->
                                        <!--                    <p-dropdown appendTo="body" [options]="nodeTypes" [(ngModel)]="selectedNodeType"-->
                                        <!--                                (onChange)="onTypeSelect($event)" *ngIf="col.header == 'Тип'"></p-dropdown>-->
                                    </div>
                                </ng-template>
                                <ng-template pTemplate="output"
                                             *ngIf="col.header !='id'">{{ getNodeTypeLabel(rowData[col.field]) }}
                                </ng-template>

                            </p-treeTableCellEditor>
                            <!--              <p-toggleButton styleClass="" onIcon="bx bx-pencil" offIcon="bx bx-pencil" [(ngModel)]="edit"-->
                            <!--                              (onChange)="onSelect($event)" *ngIf="col.header ==='id'"></p-toggleButton>-->
                            <button pButton type="button" icon="bx bx-down-arrow-alt" class="p-button-text"
                                    pTooltip="Add" tooltipPosition="top"
                                    (click)="addItem(rowData, false)" *ngIf="col.header ==='id'"></button>
                            <button pButton type="button" icon="bx bx-subdirectory-right" class="p-button-text"
                                    pTooltip="Add child" tooltipPosition="top"
                                    (click)="addItem(rowData, true)" *ngIf="col.header ==='id'"></button>
                            <button pButton type="button" icon="bx bx-trash-alt" class="p-button-text p-button-danger"
                                    pTooltip="Удалить" tooltipPosition="top"
                                    [disabled]="unSavedEdits" (click)="delete(rowData)"
                                    *ngIf="col.header ==='id'"></button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="summary">
                    <div style="text-align:left">
                        <button pButton type="button" icon="bx bx-save" label="Сохранить" [outlined]="true"
                                pTooltip="Сохранить" tooltipPosition="top"
                                (click)="nodeSave()"></button>
                    </div>
                </ng-template>
            </p-treeTable>
            <!--<p-splitButton label="" icon="bx bx-pencil" [model]="items"></p-splitButton>-->
            <!--<button pButton type="button" icon="bx bx-pencil" class="p-button-text" (click)="toggleEdit()"></button>-->

            <!--            <button pButton type="button" icon="bx bx-info-circle" label="Test" (click)="showDialog()"></button>-->

        </p-tabPanel>

        <p-tabPanel>
            <ng-template pTemplate="header">
                <span>Общие</span>
            </ng-template>
            <h2>Параметры</h2>

            <hr class="mb-3 mx-2 border-top-1 border-none border-gray-600">
            <h3>Тема</h3>

            <p-selectButton
                    [options]="themeOptions"
                    [(ngModel)]="theme"
                    (onChange)="toggleTheme($event)"
                    optionLabel="label"
                    optionValue="value"/>

            <hr class="mb-3 mx-2 border-top-1 border-none border-gray-600">

        </p-tabPanel>

        <p-tabPanel [disabled]="true">
            <ng-template pTemplate="header">
                <i class="bx bx-user bx-sm"></i>
                <span>Веб 1С</span>
            </ng-template>
            <p>
            </p>
        </p-tabPanel>

    </p-tabView>
</div>
<p-toast position="top-right"
         [life]="2000"
         [showTransformOptions]="'translateY(100%)'"
         [showTransitionOptions]="'500ms'"
         [hideTransitionOptions]="'500ms'"
         [showTransformOptions]="'translateX(100%)'">

</p-toast>
<p-confirmDialog [style]="{width: '50vw'}" [baseZIndex]="10000"></p-confirmDialog>
