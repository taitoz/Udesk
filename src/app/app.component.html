<div class="app-layout">
    <!-- Title Bar -->
    <div class="app-titlebar">
        <titleBar></titleBar>
    </div>

    <!-- Main Area (below titlebar) -->
    <div class="app-main">
        <!-- Side Bar (icon strip) -->
        <div class="app-sidebar">
            <sideBar></sideBar>
        </div>

        <!-- Side Menu (tree panel) + splitter + content -->
        <div class="app-content-area">
            <!-- Side Menu Panel -->
            @if(sideMenuVisible){
                <div class="app-sidemenu" [style.width.px]="sideMenuWidth">
                    <sideMenu [menuId]="sideMenuId"></sideMenu>
                </div>
                <!-- Draggable Splitter -->
                <div class="app-splitter"
                     (mousedown)="onSplitterMouseDown($event)">
                </div>
            }
            <!-- Content Area: settings or mainView placeholder -->
            @if (settingsVisible){
                <div class="app-content" #contentArea>
                    <settings></settings>
                </div>
            } @else {
                <!-- mainView WebContentsView is positioned over this area by Electron -->
                <div class="mainview-placeholder" #mainViewPlaceholder></div>
            }

        </div>
    </div>
</div>
